<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=block">
<style>
:root{--ink:#12141B;--ink2:#1C1F29;--chalk:#F4F4F0;--steel:#8B91A3;--ia:#3E6BFF;--hu:#FF6B2C}
*{box-sizing:border-box;margin:0}
body{background:#555;display:flex;flex-direction:column;gap:40px;padding:40px;font-family:Barlow,sans-serif}
.anton{font-family:Anton,Impact,sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
#avatar{width:800px;height:800px;background:var(--ink)}
#avatar svg{width:800px;height:800px;display:block}
/* banner 2560x1440, safe zone 1546x423 centre */
#banner{width:2560px;height:1440px;position:relative;overflow:hidden;background:var(--ink)}
#banner .l{position:absolute;inset:0;background:var(--ia);clip-path:polygon(0 0,52% 0,48% 100%,0 100%)}
#banner .r{position:absolute;inset:0;background:var(--hu);clip-path:polygon(52.6% 0,100% 0,100% 100%,48.6% 100%)}
#banner .safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#banner .plate{background:var(--ink);padding:34px 56px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;transform:skewX(-8deg)}
#banner .plate>*{transform:skewX(8deg)}
#banner .plate svg{height:150px;width:auto}
#banner .tag{color:var(--chalk);font-size:44px;letter-spacing:.04em}
#banner .tag b{color:var(--chalk)}
#banner .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(18,20,27,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(18,20,27,.13) 2px,transparent 2px);background-size:80px 80px}
/* thumbnail 1280x720 */
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--ink)}
.thumb .l{position:absolute;inset:0;background:var(--ia);clip-path:polygon(0 0,54% 0,46% 100%,0 100%)}
.thumb .r{position:absolute;inset:0;background:var(--hu);clip-path:polygon(55% 0,100% 0,100% 100%,47% 100%)}
.thumb .who{position:absolute;top:34px;font-size:64px;color:var(--ink);letter-spacing:.02em}
.thumb .who.a{left:44px}.thumb .who.b{right:44px}
.thumb .slot{position:absolute;top:140px;width:470px;height:300px;background:rgba(18,20,27,.85);border:4px solid var(--chalk);display:flex;align-items:center;justify-content:center;color:var(--steel);font-size:24px;text-align:center;padding:20px}
.thumb .slot.a{left:44px;transform:rotate(-2deg)}.thumb .slot.b{right:44px;transform:rotate(2deg)}
.thumb .vs{position:absolute;left:50%;top:250px;transform:translateX(-50%) skewX(-8deg);background:var(--ink);color:var(--chalk);font-size:96px;padding:6px 26px;line-height:1}
.thumb .title{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:108px;line-height:1;color:var(--chalk);-webkit-text-stroke:0;text-shadow:0 6px 0 var(--ink),0 -3px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink)}
.thumb .chip{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-size:24px;padding:8px 16px;font-weight:700}
</style></head><body>
