<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-data="/data/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1020" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{css}}">
<script type="application/ld+json">{{jsonld}}</script>
{{head_extra}}
</head>
<body>
<a class="skip" href="#main">{{t_skip}}</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{home_url}}">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#4338ca"/><path d="M16 16 16 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M16 16 22.5 19.5" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.4" fill="#fff"/></svg>
      <span>{{site_name}}</span>
    </a>
    <nav class="lang" aria-label="{{t_language}}">{{lang_links}}</nav>
  </div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <nav aria-label="{{t_footer}}">{{footer_links}}</nav>
    <p>© {{year}} {{site_name}} — {{t_footer_note}}</p>
  </div>
</footer>
{{scripts}}
</body>
</html>
