<div id="planner" class="hz is-loading" data-quran="{{quran_url}}"{{preset_attr}}>
  <section class="hz-presets" aria-labelledby="hz-pre-title">
    <h2 id="hz-pre-title">{{t:presets_title}}</h2>
    <div class="hz-preset-grid">
      <button type="button" class="hz-preset" data-preset='{"scope":"surah","sfrom":114,"sto":78,"unit":"ayah","order":"end","amount":3,"days":"nnnnnrr","sabqi":5,"manzil":15}'><b>{{t:pre_kids}}</b><span>{{t:pre_kids_d}}</span></button>
      <button type="button" class="hz-preset" data-preset='{"scope":"surah","sfrom":67,"sto":67,"unit":"ayah","order":"start","mode":"date","target":"+30d","days":"nnnnnnn","sabqi":7,"manzil":10}'><b>{{t:pre_mulk}}</b><span>{{t:pre_mulk_d}}</span></button>
      <button type="button" class="hz-preset" data-preset='{"scope":"surah","sfrom":18,"sto":18,"unit":"ayah","order":"start","mode":"date","target":"+90d","days":"nnnnrnn","sabqi":7,"manzil":20}'><b>{{t:pre_kahf}}</b><span>{{t:pre_kahf_d}}</span></button>
      <button type="button" class="hz-preset" data-preset='{"scope":"all","unit":"line","order":"end","amount":15,"days":"nnnnrnn","sabqi":7,"manzil":5}'><b>{{t:pre_page}}</b><span>{{t:pre_page_d}}</span></button>
      <button type="button" class="hz-preset" data-preset='{"scope":"all","unit":"line","order":"end","mode":"date","target":"+3y","days":"nnnnrnn","sabqi":7,"manzil":10}'><b>{{t:pre_3y}}</b><span>{{t:pre_3y_d}}</span></button>
    </div>
  </section>
  <div class="hz-grid">
    <form class="hz-form card" autocomplete="off">
      <h2>{{t:form_title}}</h2>
      <label class="fld"><span>{{t:f_scope}}</span>
        <select name="scope"><option value="surah">{{t:scope_surah}}</option><option value="juz">{{t:scope_juz}}</option><option value="all">{{t:scope_all}}</option></select></label>
      <div class="row" data-show="scope=juz">
        <label class="fld"><span>{{t:f_from}}</span><select name="from" data-list="juz"></select></label>
        <label class="fld"><span>{{t:f_to}}</span><select name="to" data-list="juz"></select></label>
      </div>
      <div class="row" data-show="scope=surah">
        <label class="fld"><span>{{t:f_from}}</span><select name="sfrom" data-list="surah"></select></label>
        <label class="fld"><span>{{t:f_to}}</span><select name="sto" data-list="surah"></select></label>
      </div>
      <label class="fld"><span>{{t:f_order}}</span>
        <select name="order"><option value="end">{{t:order_end}}</option><option value="start">{{t:order_start}}</option></select></label>
      <label class="fld"><span>{{t:f_unit}}</span>
        <select name="unit"><option value="ayah">{{t:unit_opt_ayah}}</option><option value="line">{{t:unit_opt_line}}</option></select></label>
      <label class="fld"><span>{{t:f_mode}}</span>
        <select name="mode"><option value="amount">{{t:mode_amount}}</option><option value="date">{{t:mode_date}}</option></select></label>
      <label class="fld" data-show="mode=amount"><span class="hz-unit-label"></span><input type="number" name="amount" min="1" max="60" inputmode="numeric"></label>
      <label class="fld" data-show="mode=date"><span>{{t:f_target}}</span><input type="date" name="tdate"></label>
      <label class="fld"><span>{{t:f_start}}</span><input type="date" name="start"></label>
      <fieldset class="fld"><legend>{{t:f_days}}</legend><div class="hz-days"></div></fieldset>
      <details class="hz-adv"><summary>{{t:f_advanced}}</summary>
        <label class="fld"><span>{{t:f_sabqi}}</span>
          <select name="sabqi"><option value="0">0</option><option>3</option><option>5</option><option>7</option><option>10</option><option>14</option></select>
          <small>{{t:f_sabqi_h}}</small></label>
        <label class="fld"><span class="hz-manzil-label"></span><input type="number" name="manzil" min="0" max="600" inputmode="numeric"><small>{{t:f_manzil_h}}</small></label>
        <fieldset class="fld"><legend>{{t:f_known}}</legend><div class="hz-known"></div><small>{{t:f_known_h}}</small></fieldset>
      </details>
      <button class="hz-btn primary" type="submit">{{t:f_submit}}</button>
    </form>
    <section class="hz-results" aria-label="{{t:schedule_title}}">
      <div class="card hz-summary" aria-live="polite"><p>{{t:loading}}</p></div>
      <div class="card"><h2>{{t:today_title}}</h2><div class="hz-today"></div></div>
      <div class="card"><h2>{{t:progress_title}}</h2><div class="hz-progress"></div>
        <div class="hz-actions">
          <button type="button" class="hz-btn primary" data-act="progress-card">{{t:share_progress}}</button>
          <button type="button" class="hz-btn" data-act="ics">{{t:export_ics}}</button>
          <button type="button" class="hz-btn" data-act="print">{{t:print}}</button>
          <button type="button" class="hz-btn" data-act="link">{{t:copy_link}}</button>
        </div>
      </div>
      <div class="card"><h2>{{t:schedule_title}}</h2><div class="hz-list"></div></div>
      <div class="card"><h2>{{t:miles_title}}</h2><div class="hz-miles"></div></div>
    </section>
  </div>
</div>
<div id="hz-print"></div>
